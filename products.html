<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #444;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .product {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin: 15px;
      width: 250px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .product:hover {
      transform: scale(1.05);
    }
    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #ddd;
    }
    .product h3 {
      margin: 15px 0 10px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      margin: 15px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Our Products</h1>
  </header>
  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 1">
      <h3>Product 1</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 2">
      <h3>Product 2</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 3">
      <h3>Product 3</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 4">
      <h3>Product 4</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 5">
      <h3>Product 5</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x180" alt="Product 6">
      <h3>Product 6</h3>
      <a href="payment.html" class="btn">Buy Now</a>
    </div>
  </div>
</body>
</html>
