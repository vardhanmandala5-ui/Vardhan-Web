<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .form-container h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }
    .btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Payment Details</h1>
  </header>
  <div class="form-container">
    <h2>Enter Your Information</h2>
    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
      
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">
      
      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Enter your address">
      
      <label for="card">Card Number</label>
      <input type="text" id="card" placeholder="1234 5678 9012 3456">
      
      <a href="thankyou.html" class="btn">Proceed to Buy</a>
    </form>
  </div>
</body>
</html>
