<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My E-Commerce Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      text-align: center;
      padding: 50px;
    }
    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #28a745;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 18px;
    }
    .btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My E-Commerce Store</h1>
  </header>
  <div class="container">
    <h2>Shop the best products here!</h2>
    <p>Click below to explore our products.</p>
    <a href="products.html" class="btn">View Products</a>
  </div>
</body>
</html>
